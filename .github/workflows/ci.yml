name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json

      - name: Verify pinned package versions
        run: pwsh ./verify-published-versions.ps1

      - name: Restore
        run: dotnet restore ANcpLua.Analyzers.slnx

      - name: Build
        # MSB4011: SDK double-import warning (harmless, tracked upstream)
        run: dotnet build ANcpLua.Analyzers.slnx -c Release --no-restore --warnaserror /warnnotaserror:MSB4011

      - name: Verify analyzer docs are not stale
        # Regenerates docs/*.md from src/ANcpLua.Analyzers.AnalyzerDocs scenarios and fails if
        # the working tree under docs/ has any diff. Forces contributors to regenerate locally
        # whenever an analyzer's diagnostic message or a scenario changes.
        run: pwsh ./scripts/generate-docs.ps1 -ValidateNoChanges

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --solution ANcpLua.Analyzers.slnx -c Release --report-xunit-trx --report-github --results-directory test_results

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test_results
          retention-days: 7