name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Verify pinned package versions
        run: pwsh ./verify-published-versions.ps1

      - name: Restore
        run: dotnet restore ANcpLua.Analyzers.slnx

      - name: Build
        # MSB4011: SDK double-import warning (harmless, tracked upstream)
        run: dotnet build ANcpLua.Analyzers.slnx -c Release --no-restore --warnaserror /warnnotaserror:MSB4011

      - name: Verify generated analyzer catalog is not stale
        run: dotnet run --project tools/ANcpLua.Analyzers.DocsGenerator --configuration Release -- --check

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --solution ANcpLua.Analyzers.slnx -c Release --report-xunit-trx --report-github --results-directory test_results

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test_results
          retention-days: 7
