name: Claude Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - 'CHANGELOG.md'
      - '**/*.lock'

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude-review:
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.actor != 'coderabbitai[bot]' &&
        !contains(github.event.pull_request.title, '[skip review]') &&
        !contains(github.event.pull_request.labels.*.name, 'skip-review')
      )
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          HEAD_REF=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName -q .headRefName)
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 20

      - name: Run Claude Code Review (agentic)
        id: claude-review
        uses: anthropics/claude-code-action@2cc1ac1331eac7a6a96d716dd204dd2888d0fcd2 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'dependabot[bot],renovate[bot]'
          track_progress: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          claude_args: '--model claude-opus-4-7 --max-turns 25'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ steps.pr.outputs.number }}

            Operating mode: **agentic**. You have write access to this PR branch.

            Decision tree:
            1. **Mechanically fixable** (formatting, naming, missing CancellationToken,
               IDisposable not disposed, .Result/.Wait blocking-async, DateTime.Now,
               null-forgiving `!`, ISourceGenerator that should be IIncrementalGenerator,
               ISymbol stored in incremental model that needs extraction to value-
               equatable data, missing LocalizableResourceString for diagnostic
               title/message) → fix in a commit pushed to this branch. Don't ask.
            2. **Structural concern needing human judgment** (architectural trade-off,
               novel pattern, transitive-dependency conflict, breaking diagnostic-ID
               change, BannedApiTests/MtpDetectionTests/SourceGeneratorDefaultsTests
               failures, severity escalation) → flag in a comment and stop.
            3. **Clean** → post a single approval-style comment and stop.

            Read AGENTS.md / CLAUDE.md / .coderabbit.yaml — the ARCHITECTURAL
            INVARIANTS sections under src/ANcpLua.Analyzers/ are authoritative.
