# Auto-merge workflow for trusted PRs
#
# Tiers:
# 1a. Dependabot PRs: Auto-approve + auto-merge for patch/minor
# 1b. Renovate PRs: Auto-approve + auto-merge
# 2.  AI Agent fix PRs (copilot/, jules/, claude/): Auto-merge when CI passes
# 3.  CodeRabbit approved PRs: Auto-merge when CI passes
# 4.  Owner PRs: Auto-merge when CI passes

name: Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: ANcpLua/renovate-config/.github/workflows/auto-merge-reusable.yml@2ca117da3e29887ce41f3c9abbcb96b14e3f79ab # main (PR #12 - immediate stable bot dependency auto-merge; major/prerelease skipped)
    secrets: inherit
