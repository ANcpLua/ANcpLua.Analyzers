# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# ANcpLua.Analyzers — Roslyn analyzers + code fixes
# Stack: C# / netstandard2.0 (analyzer constraint), IIncrementalGenerator,
#        IDiagnosticAnalyzer, CodeFixProvider
# Manual-tag-triggers-publish: tag push → publish; CI separate.
#
# Schema-validated against: https://coderabbit.ai/integrations/schema.v2.json
#

language: en-US
tone_instructions: >-
  Principal-engineer review. Direct, concise. Flag structural violations as blocking.
  Focus: incremental-generator correctness, value-equatable models, AOT safety,
  banned-API discipline, no suppression policy.
early_access: true
enable_free_tier: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  review_status: true
  review_details: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: true
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true

  labeling_instructions:
    - label: 'area:analyzers'
      instructions: 'Apply when the PR modifies src/ANcpLua.Analyzers/.'
    - label: 'area:codefixes'
      instructions: 'Apply when the PR modifies src/ANcpLua.Analyzers.CodeFixes/.'
    - label: 'area:tests'
      instructions: 'Apply when the PR modifies tests/.'
    - label: 'area:infra'
      instructions: 'Apply when the PR modifies .github/, eng/, or root build infrastructure.'
    - label: 'breaking'
      instructions: >-
        Apply when the PR introduces breaking changes: diagnostic ID renamed,
        rule severity escalated to error, code-fix removed.
  auto_apply_labels: true

  path_filters:
    - 'src/**'
    - 'tests/**'
    - 'eng/**'
    - '.github/**'
    - '*.props'
    - '*.targets'
    - '*.slnx'
    - 'global.json'
    - 'Directory.*.props'
    - 'Directory.*.targets'
    - 'Version.props'
    - '!**/*.g.cs'
    - '!**/*.Designer.cs'
    - '!**/bin/**'
    - '!**/obj/**'
    - '!**/artifacts/**'

  path_instructions:
    - path: 'src/ANcpLua.Analyzers/**/*.cs'
      instructions: |
        Roslyn analyzers — netstandard2.0 target. Modern BCL APIs unavailable;
        polyfills required for Span<T>, ranges, etc.

        ARCHITECTURAL INVARIANTS — flag violations as blocking:
        - `IIncrementalGenerator` only — never `ISourceGenerator`.
        - `ForAttributeWithMetadataName` for attribute discovery.
        - Never store `ISymbol` / `SyntaxNode` in incremental pipeline models —
          extract value-equatable data (record types with structural equality).
        - Diagnostic IDs follow ANCPxxxx pattern. Never reuse a retired ID.
        - Every diagnostic must have a corresponding LocalizableResourceString
          for title/message (no inline strings).
        - Banned-API tests must be updated when public surface changes.
        - No `DateTime.Now` — analyzers should be deterministic; if time is
          needed, inject `TimeProvider` (in netstandard2.0 use polyfill).
        - No null-forgiving `!` — rewrite the code.
        - Suppressions only acceptable: netstandard2.0 BCL workarounds where
          documented inline; experimental Roslyn API markers.

    - path: 'src/ANcpLua.Analyzers.CodeFixes/**/*.cs'
      instructions: |
        Code fix providers paired with analyzers. Review for:
        - Each `CodeFixProvider` declares the diagnostic IDs it fixes.
        - Code fix produces syntactically valid output (verify in tests).
        - No partial fixes — either the fix is complete or it doesn't register.
        - Trivia preservation (don't drop comments / formatting on fix).
        - `EquivalenceKey` is stable so VS can dedupe fix actions.

    - path: 'tests/**/*.cs'
      instructions: |
        Generator/analyzer/code-fix tests using ANcpLua.Roslyn.Utilities.Testing
        infrastructure. Review for:
        - Tests exercise the actual incremental pipeline (cache invalidation),
          not just the diagnostic output.
        - BannedApiTests, MtpDetectionTests, SourceGeneratorDefaultsTests are
          part of release-pilot's hard-stop allowlist — flag changes carefully.
        - xUnit + FluentAssertions. AAA pattern.
        - No `Task.Run(() => x.Result)` or other blocking-async.

    - path: '**/*.props'
      instructions: |
        MSBuild property files. netstandard2.0 / netcoreapp3.1 / net8.0+
        multi-targeting. Review for: TargetFrameworks correctness, that
        analyzer projects use the right `Microsoft.CodeAnalysis.*` versions
        (3.11.0 for VS 2019 floor, 4.x for newer features), and
        IsRoslynComponent=true on analyzer csproj.

    - path: 'Version.props'
      instructions: |
        Single source of truth for version. Manual-tag-triggers-publish pattern:
        the tag name (vX.Y.Z) drives the version, this file mirrors it. Review
        for: matches latest tag intention. Flag if mismatched with recent tag.

    - path: '.github/workflows/**'
      instructions: |
        Pin third-party actions to SHA. First-party (actions/*) tag-pin OK.
        Concurrency groups required on push-triggered workflows.
        Secrets via env: not inline. No secrets in logs.
        Manual-tag pattern: nuget-publish.yml runs only on tag push, ci.yml
        runs on push/PR. Don't merge their triggers.

    - path: 'AGENTS.md'
      instructions: |
        Coordination file for AI agents. Review for: consistency with actual
        repo structure, accurate references to CLAUDE.md.

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
    ignore_title_keywords:
      - 'deps('
      - '[skip ci]'
      - '[skip review]'
      - 'wip'
    labels: []
    base_branches: []
    ignore_usernames:
      - 'dependabot[bot]'
      - 'renovate[bot]'

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: 'off'
    title:
      mode: error
      requirements: |
        Conventional commits: feat|fix|refactor|chore|docs|test|ci|perf|deps.
        Under 72 chars, no trailing period.
        Examples: feat(analyzers): add ANCP0042 rule,
        fix(codefixes): preserve trivia in async-rewrite
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks:
      - mode: error
        name: 'No DateTime.Now/UtcNow in analyzer code'
        instructions: |
          Scan added/modified C# files under src/ for `DateTime.Now` or
          `DateTime.UtcNow`. Pass if none. Fail if any usage in analyzer/
          code-fix code — analyzers must be deterministic. Tests are exempt
          when the time dependency is documented.
      - mode: error
        name: 'No .Result/.Wait() blocking async'
        instructions: |
          Scan added/modified C# files for `.Result`, `.Wait()`, or
          `.GetAwaiter().GetResult()`. Pass if none. Fail if any.
      - mode: error
        name: 'No ISourceGenerator'
        instructions: |
          Scan added/modified C# files for `: ISourceGenerator` or
          `[Generator(LanguageNames.CSharp)]` patterns. Pass if none added.
          Fail if a new ISourceGenerator implementation is added — must
          use IIncrementalGenerator instead.
      - mode: warning
        name: 'No null-forgiving operator without justification'
        instructions: |
          Scan added/modified C# files for `!` (null-forgiving). Pass if
          none. Fail if any `!` is added without an inline comment
          explaining why the code can't be rewritten.
      - mode: warning
        name: 'No ISymbol stored in incremental models'
        instructions: |
          Scan added/modified C# files in incremental generator code for
          record types or classes that have ISymbol, SyntaxNode, or
          Compilation members. Pass if none. Fail if any incremental model
          stores Roslyn symbols directly — extract value-equatable data
          (string names, int positions, ImmutableArray<T> of value types).

  tools:
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 180000
    ast-grep:
      essential_rules: true
    eslint: { enabled: false }
    biome: { enabled: false }
    oxc: { enabled: false }
    ruff: { enabled: false }
    pylint: { enabled: false }
    flake8: { enabled: false }
    phpstan: { enabled: false }
    phpmd: { enabled: false }
    phpcs: { enabled: false }
    swiftlint: { enabled: false }
    detekt: { enabled: false }
    pmd: { enabled: false }
    semgrep: { enabled: false }
    opengrep: { enabled: false }
    trufflehog: { enabled: false }
    checkov: { enabled: false }
    tflint: { enabled: false }
    fortitudeLint: { enabled: false }
    rubocop: { enabled: false }
    buf: { enabled: false }
    regal: { enabled: false }
    clang: { enabled: false }
    cppcheck: { enabled: false }
    circleci: { enabled: false }
    clippy: { enabled: false }
    sqlfluff: { enabled: false }
    trivy: { enabled: false }
    prismaLint: { enabled: false }
    shopifyThemeCheck: { enabled: false }
    luacheck: { enabled: false }
    brakeman: { enabled: false }
    dotenvLint: { enabled: false }
    htmlhint: { enabled: false }
    stylelint: { enabled: false }
    checkmake: { enabled: false }
    osvScanner: { enabled: false }
    blinter: { enabled: false }
    yamllint: { enabled: false }
    psscriptanalyzer: { enabled: false }
    languagetool: { enabled: false }
    hadolint: { enabled: false }
    golangci-lint: { enabled: false }

chat:
  auto_reply: true
  art: false
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - '**/CLAUDE.md'
      - '**/AGENTS.md'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'Version.props'
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
  jira:
    usage: disabled
  linear:
    usage: disabled
  mcp:
    usage: auto

issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    auto_planning:
      enabled: false
  labeling:
    auto_apply_labels: true