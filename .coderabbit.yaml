# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit Pro+ config for ANcpLua/ANcpLua.Analyzers — v2 (2026-05-25).
#
# Rewrite drivers (vs prior 2026-05-16 version):
#
# 1. FIX: prior `auto_apply_labels: true` + 17 `labeling_instructions` caused a
#    review retry-loop on PR #174 (CR labeled the PR 9× → 8 "Review skipped"
#    dedup'd + 1 leaked through → review-comments POST exceeded GitHub's batch
#    size on the 215-file diff → "Failed to post review comments" → auto-retry
#    forever). Now: `suggested_labels` stays on (recommendations in the summary)
#    but `auto_apply_labels: false` so CR never mutates the PR's label set.
#    Reduced label catalog to 5 high-signal labels to keep suggestions sharp.
#
# 2. DE-DUP: prior config had the SAME 250-char "C#/.NET review" instruction
#    repeated 6× across `*.cs` `*.csproj` `*.props` `*.targets` `*.sln` `*.slnx`
#    (~1.5 KB of duplicated prompt per review). Same for the 9 generated-file
#    paths sharing one body. Consolidated via multi-glob arrays — same coverage,
#    one source of truth.
#
# 3. NOISE FILTERS: `path_filters` now excludes generated/snapshot/lock paths
#    at the filter level (CR never sees them) instead of the instruction level
#    (CR sees them, just gets told "don't suggest edits"). Cheaper and faster.
#
# 4. CACHE: prior `disable_cache: true` made every review cold-start. Re-enabled
#    cache for the 5-30× speedup on the assertive profile.
#
# 5. LINKED REPOS: trimmed 17 → 7 actually-related repos (CR docs warn linked
#    repo context inflates prompt size linearly).
#
# 6. AUTOFIX-FIRST: `finishing_touches.custom` recipes rewritten from
#    review-prose to action-oriented autofix instructions so CR's Pro+ autofix
#    surface actually mutates code rather than just commenting on it.
#
# 7. PRE-MERGE CHECKS: kept the 12 existing custom checks and added 3 more
#    that the renumber wave proved necessary (diagnostic-ID format, releases
#    tracking entry per new ID, generator-output not hand-edited).

language: en-US

tone_instructions: 'Principal-level review. Spend context on architecture, correctness,
  security, generated-artifact drift, and cross-repo contract drift. Direct, no praise,
  no filler, no style nits without risk.'

early_access: true
enable_free_tier: false
inheritance: false

reviews:
  profile: assertive
  request_changes_workflow: false

  # === Summary surface ===
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_instructions: 'Dense engineering summary: behavior changed, risk
    surface, validation evidence, generated artifacts, cross-repo implications. No
    praise, no filler.'

  auto_title_placeholder: "@coderabbitai title"
  auto_title_instructions: 'Conventional commits with area scope (e.g. feat(analyzers):
    …). Max 72 chars, no trailing punctuation, names the highest-impact change.'

  review_status: true
  review_details: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true

  # === Linked context ===
  assess_linked_issues: true
  related_issues: true
  related_prs: true

  # === Labels — FIX for retry-loop bug ===
  # suggested_labels keeps the recommendation surface in the walkthrough,
  # auto_apply_labels MUST stay false to prevent label-event re-trigger.
  suggested_labels: true
  auto_apply_labels: false
  labeling_instructions:
  - label: area:analyzers
    instructions: Apply when analyzer rules under src/ANcpLua.Analyzers/Analyzers/ change.
  - label: area:codefixes
    instructions: Apply when code fixes under src/ANcpLua.Analyzers.CodeFixes/CodeFixes/ change.
  - label: area:tests
    instructions: Apply when tests/ANcpLua.Analyzers.Tests/ changes.
  - label: area:infra
    instructions: Apply when .github/, eng/, Directory.Build.props, Version.props, or other root build infrastructure change.
  - label: breaking
    instructions: Apply when DiagnosticId values, public symbol shape, or analyzer-package surface changes incompatibly with prior consumers.

  suggested_reviewers: true
  auto_assign_reviewers: false
  suggested_reviewers_instructions:
  - reviewers:
    - handle: ANcpLua
      type: user
    instructions: Suggest for PRs touching architecture, public APIs, security-sensitive code, release automation, generated artifacts, or cross-repository contracts.

  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true

  # === Path filters — exclude noise at source, not at instruction level ===
  path_filters:
  - "!**/bin/**"
  - "!**/obj/**"
  - "!**/dist/**"
  - "!**/node_modules/**"
  - "!**/coverage/**"
  - "!**/.angular/**"
  - "!**/.vite/**"
  - "!**/.next/**"
  - "!**/*.min.js"
  - "!**/*.min.css"
  - "!**/artifacts/**"
  - "!**/Artifacts/**"
  - "!**/release-artifacts/**"
  - "!**/*.sarif"
  - "!**/*.trx"
  - "!**/*.nupkg"
  - "!**/*.snupkg"
  - "!**/*.Designer.cs"             # auto-generated; if wrong, fix the resx
  - "!**/Snapshots/**/*.expected.txt"  # byte-identity snapshots — no review value
  - "!**/eng/analyzer-renumber-plan.md"  # planning artifact, not reviewable
  - "!**/docs/analyzer-confidence-audit-*.md"  # generated audit
  - "!**/AnalyzerReleases.Shipped.md"  # machine-generated catalog
  - "!**/AnalyzerReleases.Unshipped.md"  # ditto (per-rule review covers content)

  # === Path instructions — de-duplicated via multi-glob arrays ===
  # Same coverage as the prior 17-entry version, ~10× less duplicated prompt.
  path_instructions:
  - path: "**/*.{cs,csproj,props,targets,sln,slnx}"
    instructions: |
      C#/.NET review. Treat as correctness concerns:
      - warnings, nullable annotations, async flow, package boundaries, generated code
      - sync-over-async (.Result, .Wait(), .GetAwaiter().GetResult())
      - fire-and-forget without lifecycle/error handling
      - missing CancellationToken on public/internal async methods
      - DateTime.Now/UtcNow in domain logic instead of TimeProvider
      - null-forgiving (!) without a documented proof
      - catch-and-fallback that hides failures
      - service-registration drift
      Prefer data-driven, composable code over hardcoded switch/case tables.
      Public package/API changes need XML docs + explicit compatibility notes.
  - path: "tests/**/*.cs"
    instructions: |
      Test review.
      - Tests must exercise observable behavior, not implementation details.
      - Async tests return Task; no Task.Run(() => x.Result) or other blocking-async.
      - Timing-sensitive tests use deterministic signals/fakes, never sleeps.
      - Testcontainers/IDisposable resources are disposed; cancellation tokens threaded.
      - New behavior gets focused regression coverage.
      - Do not weaken/delete truthful tests to make a PR pass.
      - BannedApiTests, MtpDetectionTests, SourceGeneratorDefaultsTests are hard-stop
        allowlist guards — flag changes carefully.
  - path: ".github/workflows/**"
    instructions: |
      Actions review.
      - Pin third-party actions to immutable SHAs unless the repo documents tag-pinning.
      - Keep permissions minimal per job; use concurrency for push/PR workflows.
      - No secrets in command args/logs; preserve tokenless OIDC patterns.
      - Flag admin-bypass, force-push, destructive cleanup, or auto-merge that masks failed required checks.
  - path: "**/*.{md,mdx}"
    instructions: |
      Docs review. Treat docs as executable team memory:
      - Flag instructions that disagree with actual scripts, package versions,
        branch protection, or repo layout.
      - Keep AGENTS.md/CLAUDE.md coherent with automation.
      - Don't request cosmetic prose changes unless ambiguity would mislead an agent.
  - path: "**/{*.g.cs,*.g.ts,*.g.sql,*.g.tsp,*.generated.*,*.snap}"
    instructions: |
      Generated-output discipline.
      - Never suggest hand-editing.
      - If output is wrong, identify the generator + source input and require
        regeneration in the same PR.
      - Flag source-model changes without matching generated-artifact updates.
  - path: "src/ANcpLua.Analyzers/Analyzers/**/*.cs"
    instructions: |
      Roslyn analyzer source. Hard requirements:
      - DiagnosticIds match `^AL\d{4}$` and are never reused after publish.
      - No DateTime.Now/UtcNow anywhere — analyzers must be deterministic.
      - Use IIncrementalGenerator, never ISourceGenerator.
      - ForAttributeWithMetadataName where applicable.
      - Incremental models hold value-equatable data only — no ISymbol, SyntaxNode, or Compilation references.
      - LocalizableResourceString from Resources.resx/CodeFixResources.resx for all diagnostic text (no inline strings).
      - HelpLinkUri must resolve to the analyzer's docs anchor.
      - Each new/changed analyzer requires a matching AnalyzerReleases.Unshipped.md entry.
  - path: "src/ANcpLua.Analyzers.CodeFixes/CodeFixes/**/*.cs"
    instructions: |
      Roslyn code-fix source.
      - FixableDiagnosticIds matches the analyzer's DiagnosticId exactly (string equality).
      - Complete fixes only — no half-applied transforms that compile but leave intent dangling.
      - Preserve trivia.
      - Stable equivalence keys (no string interpolation of variable data).
      - Tests prove output is syntactically valid AND semantically correct.
  - path: "Version.props"
    instructions: Manual-tag-triggers-publish pattern — the git tag drives the version, this file mirrors it. Flag mismatch with latest tag.
  - path: "AGENTS.md"
    instructions: Coordination file for AI agents. Review for consistency with actual repo structure and accurate CLAUDE.md cross-references.

  abort_on_close: true
  disable_cache: false   # FIX: re-enable cache for 5-30× CR speedup vs prior `true`

  slop_detection:
    enabled: true
    label: review:slop

  auto_review:
    enabled: true
    description_keyword: "@coderabbitai review"
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    ignore_title_keywords:
    - "[skip review]"
    labels: []
    drafts: true
    base_branches:
    - ".*"
    ignore_usernames: []

  # === Finishing touches — autofix-first (rewritten from review-prose) ===
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true
    custom:
    - enabled: true
      name: autofix public XML doc gaps
      instructions: |
        Pro+ autofix: for each public/protected/internal-with-InternalsVisibleTo
        analyzer or code-fix symbol added in this PR that lacks XML docs, generate
        them. Document intent + contracts + DiagnosticId + cancellation/exceptions
        where applicable. Skip private implementation members. Don't restate the
        method name.
    - enabled: true
      name: autofix missing analyzer test coverage
      instructions: |
        Pro+ autofix: for each new analyzer DiagnosticDescriptor in
        src/ANcpLua.Analyzers/Analyzers/, generate a focused test under
        tests/ANcpLua.Analyzers.Tests/ that:
        - exercises the positive case (rule fires) AND the negative case (rule doesn't fire)
        - uses ANcpLua.Roslyn.Utilities.Testing's verifier infrastructure
        - asserts the diagnostic message AND span location
        - exercises any provided CodeFixProvider via the verifier's WithFixedCode path
        Mirror the surrounding-file naming pattern (e.g. Al{NewId}AnalyzerTests.cs).
    - enabled: true
      name: autofix incremental-pipeline forbidden types
      instructions: |
        Pro+ autofix: if an analyzer incremental-pipeline value-type carries
        ISymbol/SyntaxNode/Compilation, rewrite it to extract value-equatable data
        (name strings, ImmutableArray<T> of value records). Required for incremental
        cache correctness; not negotiable.
    - enabled: true
      name: autofix release-tracking entry
      instructions: |
        Pro+ autofix: if a new DiagnosticDescriptor or DiagnosticId const is added
        in this PR but AnalyzerReleases.Unshipped.md doesn't yet have a row for it,
        add the row in the format `RuleID | Category | Severity | Notes`. Use the
        descriptor's title for the Notes column.
    - enabled: true
      name: autofix sync-over-async / cancellation gaps
      instructions: |
        Pro+ autofix: where a public/internal async method lacks a CancellationToken
        parameter, add `CancellationToken cancellationToken = default` and thread
        it through. Where `.Result` / `.Wait()` / `.GetAwaiter().GetResult()` blocks
        an async path, rewrite to await. Don't suppress with `#pragma` — fix or
        leave a precise comment explaining why no fix is possible.

  # === Pre-merge hard gates — 15 custom checks ===
  pre_merge_checks:
    override_requested_reviewers_only: true
    docstrings:
      mode: warning
      threshold: 75
    title:
      mode: error
      requirements: 'Conventional commits with area scope; under 72 characters; no trailing punctuation; names the highest-impact change.'
    description:
      mode: error
    issue_assessment:
      mode: warning
    custom_checks:
    # === Security & data ===
    - mode: error
      name: No Secrets Or PII
      instructions: 'Fail if the PR adds secrets, tokens, credentials, private keys, real user data, API keys, connection strings, or logs that expose sensitive request/response bodies. Test placeholders only when obviously synthetic and documented.'
    # === Generated artifacts ===
    - mode: error
      name: Generated Files Regenerated
      instructions: 'If a source schema/model/template/generator input changes, all generated downstream files required by the repo must be updated in the same PR. Fail if generated files appear hand-edited without the corresponding source change, or if generated output is missing after source-model changes.'
    - mode: error
      name: Generated Code Not Hand-Edited
      instructions: 'Fail if `**/*.g.cs`, `**/*.Designer.cs`, `**/*.generated.*` files have direct edits in this PR that are NOT accompanied by a corresponding source-input/template/.resx change in the same PR.'
    # === Async / threading ===
    - mode: error
      name: Async And Cancellation Safe
      instructions: 'Fail C#/TS/Python changes that introduce sync-over-async, unobserved fire-and-forget work, missing CancellationToken/AbortSignal propagation on public/internal async boundaries, sleeps for synchronization, or resource-disposal paths that can drop in-flight work.'
    - mode: error
      name: No .Result/.Wait() blocking async
      instructions: 'Scan added/modified C# files for `.Result`, `.Wait()`, or `.GetAwaiter().GetResult()`. Pass if none. Fail if any.'
    # === Public contract ===
    - mode: error
      name: Public Contract Documented
      instructions: 'Fail if public APIs, endpoint schemas, CLI flags, config keys, package surfaces, storage formats, event schemas, MCP tool schemas, or generated contracts change without matching docs/tests and explicit compatibility notes in the PR description or changelog.'
    # === CI / release safety ===
    - mode: error
      name: CI Release Safety
      instructions: 'If no workflow/build/release files changed, pass. Fail when a changed workflow removes an existing validation job, removes concurrency from push/PR workflows, adds --admin/force-push/bypass commands, increases token permissions beyond contents:read without inline rationale, exposes secrets in command arguments/logs, changes publish triggers to run outside tags or approved environments, or allows a previously required failing check to be ignored.'
    # === Analyzer-specific (this is an analyzer repo) ===
    - mode: error
      name: Diagnostic ID Format Conformance
      instructions: 'Fail any new or modified `const string DiagnosticId = "..."` literal in src/ANcpLua.Analyzers/Analyzers/ whose value does not match `^AL\d{4}$`. The repo enforces the AL#### format and reserves AL0xxx for sibling packages — new analyzer IDs must land in AL1xxx..AL1899.'
    - mode: error
      name: AnalyzerReleases Tracking
      instructions: 'If a new analyzer DiagnosticDescriptor is added in src/, fail if `AnalyzerReleases.Unshipped.md` does not have a matching row. Format: `RuleID | Category | Severity | Notes`.'
    - mode: error
      name: No DateTime.Now/UtcNow in analyzer code
      instructions: 'Scan added/modified C# files under src/. Pass if none use `DateTime.Now` / `DateTime.UtcNow`. Fail if any usage in analyzer/code-fix code — analyzers must be deterministic. Tests are exempt only when the time dependency is documented.'
    - mode: error
      name: No ISourceGenerator
      instructions: 'Scan added/modified C# files for `: ISourceGenerator` or new `[Generator(LanguageNames.CSharp)]` on a non-`IIncrementalGenerator`. Pass if none. Fail if a new ISourceGenerator implementation is added.'
    - mode: warning
      name: No ISymbol stored in incremental models
      instructions: 'Scan added/modified C# files in incremental-generator code for record types or classes that have ISymbol, SyntaxNode, or Compilation members. Pass if none. Fail if any incremental model stores Roslyn symbols directly — extract value-equatable data (string names, int positions, ImmutableArray<T> of value types).'
    - mode: warning
      name: No null-forgiving operator without justification
      instructions: 'Scan added/modified C# files for `!` (null-forgiving). Pass if none. Fail if any `!` is added without an inline comment explaining why the code can''t be rewritten.'
    # === Architecture hygiene ===
    - mode: warning
      name: Tests Match Risk
      instructions: 'Warn when production behavior changes without focused tests or when tests only assert implementation details. Require integration/e2e coverage for persistence, queues, external-service boundaries, generated contracts, migrations, or user-visible workflows touched by the PR.'
    - mode: warning
      name: No Copy Paste Tables
      instructions: 'Warn when a PR introduces hardcoded repetitive case lists, hand-maintained mapping tables, duplicate switch branches, or parallel arrays where a data-driven or generated structure would be more maintainable. Don''t warn for small explicit protocol enums or tests where duplication clarifies cases.'
    - mode: warning
      name: No Hidden Fallback Path
      instructions: 'Warn when code catches and silently falls back, adds compatibility wrappers, duplicate implementation paths, or default behavior that hides upstream failure unless the fallback is a documented product requirement with tests for both paths.'
    - mode: warning
      name: Observability Boundary
      instructions: 'Warn when new services, background jobs, queues, network clients, storage writers, MCP tools, or agent workflows lack structured logging, tracing/metrics where the repository already uses them, or actionable error context.'
    - mode: warning
      name: Dependency Hygiene
      instructions: 'Warn when dependencies are added without clear need, version pins drift from central package files, lockfile changes do not match manifest changes, transitive security-sensitive packages are introduced, or package manager conventions are violated.'

  tools:
    # === Always-on — high signal for this analyzer repo ===
    ast-grep:
      essential_rules: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 900000
    languagetool:
      enabled: true
      level: default
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    checkov:
      enabled: true
    opengrep:
      enabled: true
    semgrep:
      enabled: true
    trivy:
      enabled: true
    osvScanner:
      enabled: true
    psscriptanalyzer:
      enabled: true
    # === Off — language not in this repo, no signal ===
    ruff:           {enabled: false}
    biome:          {enabled: false}
    hadolint:       {enabled: false}
    swiftlint:      {enabled: false}
    phpstan:        {enabled: false}
    phpmd:          {enabled: false}
    phpcs:          {enabled: false}
    golangci-lint:  {enabled: false}
    tflint:         {enabled: false}
    detekt:         {enabled: false}
    eslint:         {enabled: false}
    flake8:         {enabled: false}
    fortitudeLint:  {enabled: false}
    rubocop:        {enabled: false}
    buf:            {enabled: false}
    regal:          {enabled: false}
    pmd:            {enabled: false}
    clang:          {enabled: false}
    cppcheck:       {enabled: false}
    circleci:       {enabled: false}
    clippy:         {enabled: false}
    sqlfluff:       {enabled: false}
    prismaLint:     {enabled: false}
    pylint:         {enabled: false}
    oxc:            {enabled: false}
    shopifyThemeCheck: {enabled: false}
    luacheck:       {enabled: false}
    brakeman:       {enabled: false}
    dotenvLint:     {enabled: false}
    htmlhint:       {enabled: false}
    stylelint:      {enabled: false}
    checkmake:      {enabled: false}
    blinter:        {enabled: false}
    smartyLint:     {enabled: false}
    emberTemplateLint: {enabled: false}
    presidio:       {enabled: false}  # PII detection — no PII surface in analyzer repo

chat:
  art: false
  allow_non_org_members: false
  auto_reply: true
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
    - CLAUDE.md
    - AGENTS.md
    - "**/CLAUDE.md"
    - "**/AGENTS.md"
    - ".editorconfig"
    - README.md
    - docs/**/*.md
    - Directory.Build.props
    - Directory.Packages.props
    - global.json
    - Version.props
    - eng/analyzer-renumber-plan.md  # AL2.0 renumber playbook
  learnings:
    scope: global
  issues:
    scope: global
  jira:
    usage: disabled
  linear:
    usage: disabled
  pull_requests:
    scope: global
  mcp:
    usage: auto
  linked_repositories:
  # Trimmed 17 → 7 truly-related (CR docs warn linked-repo context inflates prompt linearly).
  - repository: ANcpLua/ANcpLua.NET.Sdk
    instructions: This SDK transitively bundles ANcpLua.Analyzers via its config/Analyzer.ANcpLua.Analyzers.editorconfig. AL ID changes here flow into every SDK consumer. Use for SDK-consumer impact context.
  - repository: ANcpLua/ANcpLua.Roslyn.Utilities
    instructions: Source-only sibling package providing AlAnalyzer base class, Guard helpers, and incremental-pipeline patterns. AlAnalyzer.CreateRule's `$"{id}AnalyzerTitle"` interpolation determines resx-key naming.
  - repository: ANcpLua/Qyl.OpenTelemetry.SemanticConventions
    instructions: Sibling analyzer family (QYL####). Cross-team flag any AL rule that's semantically OpenTelemetry-shaped (Activity/Meter/spans/OTLP/SchemaUrl) — those belong in QYL, not AL.
  - repository: ANcpLua/ANcpLua.Agents
    instructions: MAF-bundling consumer of ANcpLua.Analyzers. Use for runtime-consumer breakage signals.
  - repository: O-ANcppLua/qyl
    instructions: Largest end-consumer of both ANcpLua.Analyzers and Qyl.OpenTelemetry.SemanticConventions.Analyzers. Has 32 AL editorconfig rules + 24 global config rules. Reference for "will a renumber break consumers" questions.
  - repository: ANcpLua/ErrorOrX
    instructions: Smaller library consumer of ANcpLua.Analyzers. Reference for downstream-impact context.
  - repository: ANcpLua/TourPlanner
    instructions: Application consumer. Reference for downstream-impact context.

code_generation:
  docstrings:
    language: en-US
    path_instructions:
    - path: "**/*.cs"
      instructions: 'Generate XML docs for public/protected APIs only. Document intent, DiagnosticId, contracts, cancellation, exceptions, compatibility. Don''t add obvious comments to private implementation members.'
  unit_tests:
    path_instructions:
    - path: "src/ANcpLua.Analyzers/Analyzers/**/*.cs"
      instructions: 'Generate xUnit tests using ANcpLua.Roslyn.Utilities.Testing verifier infrastructure. Cover: rule-fires positive case, rule-doesn''t-fire negative case, diagnostic span correctness, and code-fix output verification when a paired CodeFixProvider exists. Mirror file naming pattern (Al{Id}AnalyzerTests.cs).'
    - path: "src/ANcpLua.Analyzers.CodeFixes/CodeFixes/**/*.cs"
      instructions: 'Generate xUnit tests using the same verifier infrastructure. Cover: fix produces syntactically valid output, fix preserves trivia, fix has stable equivalence key, fix handles edge cases (whitespace-only, leading/trailing trivia, nested expressions).'

issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels:
      - plan:auto
      - enhancement
      - bug
      - good-first-issue
      - help-wanted
  labeling:
    # Issue labels are safe to auto-apply (issue-event ≠ PR-event, no review retry-loop).
    auto_apply_labels: true
    labeling_instructions:
    - label: bug
      instructions: Apply when the issue reports incorrect behavior, failing tests, regressions, or broken automation.
    - label: enhancement
      instructions: Apply when the issue asks for new capability or meaningful improvement.
    - label: documentation
      instructions: Apply when the issue is primarily about docs, examples, guides, or agent instructions.
    - label: security
      instructions: Apply when the issue involves secrets, auth, privacy, dependency risk, or exploitability.
    - label: dependencies
      instructions: Apply when the issue is about package, SDK, runtime, or lockfile updates.
    - label: good-first-issue
      instructions: Apply only when the issue is small, well-scoped, and low-risk for a new contributor or agent.
